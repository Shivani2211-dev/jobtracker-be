name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # Migrations must build the schema on an empty database - the app no
      # longer creates tables itself, so a broken migration fails here.
      - name: Migrations apply cleanly and match the models
        run: |
          alembic upgrade head
          alembic check
        env:
          DATABASE_URL: sqlite:///./ci.db
      - run: pytest -q
      - name: Tailor eval - no unsupported claim may pass
        run: python -m evals.tailor_eval
